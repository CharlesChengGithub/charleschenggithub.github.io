# 开源软件（网站和简历都显示）
software:
  - name: llmarket
    url: https://github.com/CharlesChengGithub/llmarket
    meta:
      en: "Developer and maintainer · Python · MIT License · v0.1.1, October 2026"
      zh: 开发和维护 · Python · MIT 许可 · v0.1.1，2026 年 10 月
    tagline:
      en: An open-source agent-based simulation toolkit for economics, with LLM agents, reinforcement learners and price regulation
      zh: 开源的经济学多主体模拟工具，支持大模型主体、强化学习主体和价格规制
    summary:
      en: LLM agents, Q-learning agents and rule-based agents compete in the same market. The first built-in scenario is algorithmic pricing under switchable regulation, with five cost-based price floors, price caps, and separate enforcement and disclosure settings. The Q-learning engine reproduces the Calvano et al. (2020) baseline session by session; LLM runs come with response caching, deterministic seeds, a cost ledger with a budget guard and an offline mock client.
      zh: 大模型主体、Q-learning 主体和规则主体可以在同一个市场中竞争。第一个内置场景是算法定价，价格规制可以开关：五种成本口径的底价、价格上限，执行方式和信息披露也可以分别设置。Q-learning 引擎逐个 session 复现 Calvano 等（2020）的基准结果；大模型实验带回答缓存、固定种子、带预算上限的费用台账和离线模拟客户端。

