bio:
  en: |
    I am a Ph.D. candidate at the School of Finance, Zhongnan University of Economics and Law, and expect to graduate in June 2027. I studied information security, a computer science major, at Hefei University of Technology, worked for four years in overseas brand planning at JAC Motors, and then studied finance at Hainan University.

    My research asks how artificial intelligence changes economic decisions and markets, and uses computation to evaluate policy. In one line of work, AI is the object of study: how AI that generates research candidates changes the demand for the specialists who validate them, whether pricing algorithms collude more under price floors, whether firms that adopt generative AI employ fewer back-office staff, and how students choose college majors once AI is in view. In a second line, computation is the method: agent-based models of futures markets and of China's solar photovoltaic industry, and Monte Carlo evidence on overlapping pilot policies.

    Programming is central to how I work. I clean and analyze nearly five million futures brokerage records in Python, build agent-based models and reinforcement-learning experiments, and maintain [llmarket](https://github.com/CharlesChengGithub/llmarket), an open-source toolkit in which LLM agents, reinforcement learners and rule-based agents trade in the same market under price regulation that can be switched on and off.
  zh: |
    中南财经政法大学金融学院博士研究生，预计 2027 年 6 月毕业。本科就读于合肥工业大学信息安全专业（计算机类），毕业后在江淮汽车国际公司从事海外品牌策划工作四年，硕士就读于海南大学金融学专业。

    我的研究关注人工智能如何改变经济决策与市场运行，并用计算方法评估政策。一条线索以人工智能为研究对象：AI 生成候选方案、专家负责验证时，研发对专家的需求如何变化；底价规则是否让定价算法更容易合谋；采用生成式 AI 的企业是否减少后台岗位；考生在 AI 冲击下如何选择专业。另一条线索以计算为方法：用多主体模型研究期货市场和光伏组件行业的价格规制，用蒙特卡洛模拟检验试点政策叠加对双重差分估计的影响。

    编程是我做研究的基本功。我用 Python 清洗和分析近 500 万条期货公司账户交易记录，搭建多主体模型和强化学习实验，并开发、维护开源工具 [llmarket](https://github.com/CharlesChengGithub/llmarket)：大模型主体、强化学习主体和规则主体可以在同一个市场中交易，价格规制可以随时开关。

